[project]
name = "luneta-api"
version = "0.1.0"
description = "Luneta API - FastAPI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.3.0",
  "email-validator>=2.2.0",
  "motor>=3.4.0",
  "dnspython>=2.0.0",
  "minio>=7.2.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.1",
  "openai>=1.40.0",
  "google-genai>=1.0.0",
  "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
