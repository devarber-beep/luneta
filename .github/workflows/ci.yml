name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install api deps
        working-directory: apps/api
        run: |
          pip install -e .[dev]

      - name: Install web deps
        working-directory: apps/web
        run: |
          pnpm install

      - name: Run api tests
        working-directory: apps/api
        run: pytest

      - name: Build web
        working-directory: apps/web
        run: pnpm build

